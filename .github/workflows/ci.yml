name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    test:
        runs-on: ubuntu-latest
        name: node ${{ matrix.node-version }} / graphql ${{ matrix.graphql-version }}
        strategy:
            fail-fast: false
            matrix:
                node-version: [20.x, 22.x, 24.x]
                graphql-version: [16, 17]
                exclude:
                    # GraphQL 17 requires Node 22+. Node 20 stays covered by the
                    # GraphQL 16 leg, which is what Node 20 users can install.
                    - node-version: 20.x
                      graphql-version: 17
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
            - run: bun install --frozen-lockfile
            - name: Pin graphql to the matrix version
              run: bun add --dev graphql@${{ matrix.graphql-version }}
            - run: bun run lint
            - run: bun run format:check
            - run: bun run typecheck
            - run: bun run test:run
            - run: bun run build
            - name: Declarations must name only types the oldest supported graphql exports
              # An inferred type spells out every node kind, including kinds
              # added after graphql 16.0, and consumers on older 16.x then
              # fail to type-check our .d.ts. Explicit annotations avoid that.
              run: '! grep -rn ''import("graphql")'' packages/*/dist --include=*.d.ts'
            - name: Integration test
              working-directory: integration-test
              # `bun add` must come before the install: running it against an
              # existing node_modules breaks the `file:..` link to the plugin.
              run: |
                  bun add graphql@${{ matrix.graphql-version }}
                  bun install --no-frozen-lockfile
                  bun run test

    # The job above builds with the Vite the repo develops against. The peer
    # range also promises the earlier majors.
    integration-vite:
        runs-on: ubuntu-latest
        name: integration / vite ${{ matrix.vite-version }}
        strategy:
            fail-fast: false
            matrix:
                vite-version: [5, 6, 7]
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.x
            - run: bun install --frozen-lockfile
            - run: bun run build
            - name: Integration test
              working-directory: integration-test
              run: |
                  bun add vite@${{ matrix.vite-version }}
                  bun install --no-frozen-lockfile
                  bun run test
