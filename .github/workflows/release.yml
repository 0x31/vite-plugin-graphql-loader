name: Release

on:
    push:
        tags:
            # One package per tag: `vite-v5.3.0` publishes packages/vite,
            # `bun-v2.0.0` publishes packages/bun.
            - "vite-v*"
            - "bun-v*"

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - uses: actions/setup-node@v4
              with:
                  node-version: 24.x
                  registry-url: https://registry.npmjs.org
            - name: Resolve package directory from tag
              id: target
              run: |
                  case "$GITHUB_REF_NAME" in
                      vite-v*) echo "dir=packages/vite" >> "$GITHUB_OUTPUT" ;;
                      bun-v*)  echo "dir=packages/bun"  >> "$GITHUB_OUTPUT" ;;
                      *) echo "Unrecognized tag $GITHUB_REF_NAME" >&2; exit 1 ;;
                  esac
            - run: bun install --frozen-lockfile
            - run: bun run lint
            - run: bun run format:check
            - run: bun run typecheck
            - run: bun run test:run
            - run: bun run build
            - name: Integration test
              working-directory: integration-test
              run: |
                  bun install --no-frozen-lockfile
                  bun run test
            # Auth + signing both come from the GitHub Actions OIDC identity.
            # Requires Trusted Publishing to be configured on npmjs.com for
            # whichever package this tag targets.
            - run: npm publish --provenance --access public
              working-directory: ${{ steps.target.outputs.dir }}
            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
